[project]
name = "xauusd-scalping"
version = "0.1.0"
description = "High-precision tick-level research and reality simulation platform for XAUUSD scalping"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "polars>=1.0.0",
    "duckdb>=1.0.0",
    "pyarrow>=17.0.0",
    "MetaTrader5>=5.0.45; sys_platform == 'win32'",
    "scipy>=1.13.0",
    "numpy>=1.26.0",
    "pydantic>=2.7.0",
    "rich>=13.7.0",
    "tzdata>=2024.1; sys_platform == 'win32'",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[tool.pytest.ini_options]
# Keep bare `pytest` on the maintained suite. `scratch/` and
# `experiments_isolated/` hold one-off research probes that read hundreds of MB
# of parquet at import time; collecting them hangs the run.
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

